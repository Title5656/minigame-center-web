name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run check

      - name: Enable GitHub Pages
        id: enable-pages
        env:
          TOKEN: ${{ secrets.PAGES_PAT || github.token }}
        run: |
          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          STATE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" "$URL")
          if [ "$STATE" = "200" ]; then
            BT=$(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('build_type',''))")
            if [ "$BT" != "workflow" ]; then
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" -d '{"build_type":"workflow"}' "$URL")
              if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
                echo "::error::Cannot switch GitHub Pages to the GitHub Actions source (HTTP $CODE). Set Settings -> Pages -> Source -> GitHub Actions and re-run."
                exit 1
              fi
            fi
          elif [ "$STATE" = "404" ]; then
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" -d '{"build_type":"workflow"}' "$URL")
            if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
              echo "::error::GitHub Pages is not enabled and this token cannot enable it (HTTP $CODE). Set Settings -> Pages -> Source -> GitHub Actions and re-run."
              exit 1
            fi
          else
            echo "::error::Unexpected GitHub Pages API status: $STATE"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4