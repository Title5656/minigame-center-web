name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage public files
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -r css _site/
          cp -r js _site/

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4