name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run check

      - name: Enable GitHub Pages
        id: enable-pages
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAGES_PAT || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const token = process.env.GITHUB_TOKEN;
            const base = `https://api.github.com/repos/${owner}/${repo}/pages`;
            const headers = {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json'
            };

            async function getPages() {
              const res = await fetch(base, { headers });
              if (res.status === 200) return await res.json();
              if (res.status === 404) return null;
              throw new Error(`GET /pages failed: ${res.status} ${await res.text()}`);
            }

            async function switchToWorkflow(current) {
              const res = await fetch(base, {
                method: 'PUT',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify({ build_type: 'workflow' })
              });
              if (res.status === 200 || res.status === 201) {
                core.info('Switched GitHub Pages to the GitHub Actions source.');
                return;
              }
              if (res.status === 403) {
                core.setFailed(
                  `GitHub Pages is ${current ? 'deploying from a branch' : 'not enabled'} and this token ` +
                  'cannot switch it to the GitHub Actions source via the API.\n' +
                  'Set Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions", then re-run.'
                );
                return;
              }
              throw new Error(`Switch Pages failed: ${res.status} ${await res.text()}`);
            }

            const site = await getPages();
            if (site === null) {
              const res = await fetch(base, {
                method: 'POST',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify({ build_type: 'workflow' })
              });
              if (res.status === 201) {
                core.info('Created GitHub Pages site with the GitHub Actions source.');
              } else if (res.status === 403 || res.status === 404) {
                core.setFailed(
                  'GitHub Pages is not enabled and this token cannot enable it.\n' +
                  'Set Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions", then re-run.'
                );
              } else {
                throw new Error(`Create Pages failed: ${res.status} ${await res.text()}`);
              }
            } else if (site.build_type !== 'workflow') {
              await switchToWorkflow(site);
            } else {
              core.info('GitHub Pages enabled with the GitHub Actions source.');
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public files
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -r css _site/
          cp -r js _site/

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4