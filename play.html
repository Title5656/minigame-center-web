<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Play one of nine arcade games: Breakout, Snake, Memory Match, Pixel Runner, Astro Dodge, Tower Drop, Hex Slide, Orbit Tap, Light Trails.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'">
<title>Play · Mini Game Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
</head>
<body>
<a href="index.html" class="skip-link">Back to home</a>
<div class="bg-pixels" aria-hidden="true">
  <span class="sprite sprite-rocket sprite-1"></span>
  <span class="sprite sprite-cat sprite-2"></span>
  <span class="sprite sprite-ufo sprite-3"></span>
  <span class="sprite sprite-starburst sprite-4"></span>
  <span class="sprite sprite-heart sprite-5"></span>
</div>
<div id="blockTransition" aria-hidden="true"></div>
<header>
  <div class="container nav">
    <div class="logo">ARCADE</div>
    <nav class="nav-links" aria-label="Site navigation">
      <a href="index.html">Home</a>
      <a href="index.html#games">All Games</a>
    </nav>
  </div>
</header>

<main class="container">
  <section>
    <div class="game-nav" id="gameNav"></div>
    <div class="arcade-shell">
      <div id="game-root"></div>

      <div class="not-found-panel" id="notFoundPanel">
        <h2 class="not-found-title">Game Not Found</h2>
        <p class="not-found-msg">That game doesn't exist.</p>
        <a class="not-found-home" href="index.html" id="notFoundHome">← Back to All Games</a>
      </div>
    </div>
  </section>
</main>

<footer class="container">Arcade Mini Game Center · Pixel Arcade Theme</footer>

<script type="module" src="/src/play.js"></script>
</body>
</html>
